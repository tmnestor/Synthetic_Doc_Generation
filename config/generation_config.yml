output_dir: output
derived_dir: derived
ground_truth_dir: ground_truth

document_types:
  bank_statements:
    ground_truth: ground_truth/bank_statements.yml
    layouts: config/layouts/bank_statements.yml
    output_subdir: bank_statements
    generate_clean: true
  receipts:
    ground_truth: ground_truth/receipts.yml
    layouts: config/layouts/receipts.yml
    output_subdir: receipts
    generate_clean: true
  invoices:
    ground_truth: ground_truth/invoices.yml
    layouts: config/layouts/invoices.yml
    output_subdir: invoices
    generate_clean: true

derived_formats:
  csv: true
  jsonl: true

# Evaluation-set export consumed by the extraction benchmark.
# `python -m generators.pipeline eval-set --out <dir>` renders every document
# of the listed types once, saving a clean copy into <out>/<clean_dir_prefix>_<date>/
# and a degraded copy into <out>/<degraded_dir_prefix>_<date>/ under the same
# generic {case}_{document_type}.png name, then writes the schema-projected
# ground truth into both directories so each is self-contained.
# Every key is required — the export fails fast on any omission.
eval_set:
  # config/extraction_schema.yml declares exactly these three document types —
  # the whole surviving corpus.
  document_types: [bank_statements, invoices, receipts]
  clean_dir_prefix: synthetic
  degraded_dir_prefix: degraded
  csv_name: ground_truth.csv
  jsonl_name: ground_truth.jsonl
