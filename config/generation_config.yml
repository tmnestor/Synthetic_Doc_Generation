output_dir: output
derived_dir: derived
ground_truth_dir: ground_truth

document_types:
  bank_statements:
    ground_truth: ground_truth/bank_statements.yml
    layouts: config/layouts/bank_statements.yml
    output_subdir: bank_statements
    generate_clean: true
    generate_degraded: true
  receipts:
    ground_truth: ground_truth/receipts.yml
    layouts: config/layouts/receipts.yml
    output_subdir: receipts
    generate_clean: true
    generate_degraded: true
  invoices:
    ground_truth: ground_truth/invoices.yml
    layouts: config/layouts/invoices.yml
    output_subdir: invoices
    generate_clean: true
    generate_degraded: true
  cc_statements:
    ground_truth: ground_truth/cc_statements.yml
    layouts: config/layouts/cc_statements.yml
    output_subdir: cc_statements
    generate_clean: true
    generate_degraded: true
  trust_returns:
    ground_truth: ground_truth/trust_returns.yml
    layouts: config/layouts/trust_returns.yml
    output_subdir: trust_returns
    generate_clean: true
    generate_degraded: true
  distribution_statements:
    ground_truth: ground_truth/distribution_statements.yml
    layouts: config/layouts/distribution_statements.yml
    output_subdir: distribution_statements
    generate_clean: true
    generate_degraded: true
  trust_income_schedules:
    ground_truth: ground_truth/trust_income_schedules.yml
    layouts: config/layouts/trust_income_schedules.yml
    output_subdir: trust_income_schedules
    generate_clean: true
    generate_degraded: true
  beneficiary_itrs:
    ground_truth: ground_truth/beneficiary_itrs.yml
    layouts: config/layouts/beneficiary_itrs.yml
    output_subdir: beneficiary_itrs
    generate_clean: true
    generate_degraded: true

degradation:
  paper_tint_alpha: [0.03, 0.08]
  contrast_factor: [0.85, 0.95]
  brightness_factor: [0.90, 1.00]
  blur_radius: [0.3, 0.8]
  rotation_degrees: [0.5, 2.0]
  noise_density: [0.001, 0.005]
  jpeg_quality: [70, 85]

derived_formats:
  csv: true
  jsonl: true

# Flat evaluation-set export consumed by the LMM_POC extraction pipeline.
# `python -m generators.pipeline eval-set --out <dir>` renders one clean image
# per document for the listed types into a single directory, writes the raw
# synthetic.yml those documents describe, then hands the directory to
# LMM_POC's relabel_evaluation_set.py, which owns schema projection.
# Every key is required — the export fails fast on any omission.
eval_set:
  # Deliberately excludes cc_statements and the four trust types: the relabel
  # script maps exactly these three DOCUMENT_TYPEs to filename suffixes.
  document_types: [bank_statements, invoices, receipts]
  relabel_script: /Users/tod/Desktop/LMM_POC/scripts/relabel_evaluation_set.py
  relabel_repo_root: /Users/tod/Desktop/LMM_POC
  csv_name: ground_truth.csv
