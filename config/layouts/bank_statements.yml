    show_opening_balance: true
    show_footer_transaction_types: true
    date_grouping: true
    date_format: "DD MMM YYYY"
    body:
      - {type: text, content: "{SUPPLIER_NAME}", role: header, color: "#12107D",
         field: SUPPLIER_NAME}
      - type: block
        role: footer
        color: "#666666"
        lines:
