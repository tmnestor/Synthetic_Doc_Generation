_bank_base: &bank_base
  page_dimensions: {width: 1800, height: 3508}
  content_width: 1600

_cba: &cba
  <<: *bank_base
  bank: Commonwealth Bank of Australia
  logo_text: Commonwealth Bank
  bank_code: CBA
  margin: 100
  bank_name_color: "#12107D"
  field_budgets:
    TRANSACTION_DESC: {width: 760, fit: wrap, min_font: 10, max_lines: 2}
    SUPPLIER_NAME: {width: 1600, fit: shrink, min_font: 12, max_lines: 1}

_westpac: &westpac
  <<: *bank_base
  bank: Westpac Banking Corporation
  logo_text: Westpac
  bank_code: WBC
  margin: 80
  logo_color: "#C41E3A"
  field_budgets:
    TRANSACTION_DESC: {width: 1064, fit: wrap, min_font: 10, max_lines: 2}
    SUPPLIER_NAME: {width: 1600, fit: shrink, min_font: 12, max_lines: 1}

# Column content anchors match the legacy Westpac renderer's actual draw
# positions exactly (col_date_right+8, col_debit_right-8, right_edge-8 —
# see bank_statement.py:504-519), not the brief's illustrative offsets,
# which were copied from CBA's column geometry and don't fit a 1600px-wide
# bordered table with these divider positions. There is no balance column:
# legacy Westpac never draws or records ACCOUNT_BALANCE.
_westpac_txn_columns: &westpac_txn_columns
  - {key: date, label: "Date of\nTransaction", align: left, x: 8}
  - {key: description, label: Description, align: left, x: 208,
     budget: TRANSACTION_DESC, field: TRANSACTION_DESCRIPTIONS}
  - {key: debit, label: Debits, align: right, x_right: -168,
     field: TRANSACTION_AMOUNTS_PAID, currency: plain}
  - {key: credit, label: "Credits (-)", align: right, x_right: -8,
     field: TRANSACTION_AMOUNTS_RECEIVED, currency: plain}

# The three interior column-divider lines (col_date_right, col_desc_right,
# col_debit_right in the legacy renderer), independent of the content
# anchors above — legacy insets content 8px from each divider, so the
# dividers themselves sit at different x than any column's own text.
_westpac_txn_dividers: &westpac_txn_dividers
  - {x: 200}
  - {x_right: -320}
  - {x_right: -160}

# NAB's transaction columns (see bank_statement.py:674-684, render_nab). Row
# content anchors, not the header's: the description column sits at
# col_desc_x+20 (legacy indents row text but not the "Particulars" header
# label by the same 20px) because TRANSACTION_DESCRIPTIONS geometry is what
# the equivalence harness checks — the header label itself is never recorded,
# so it is the one place these two layouts accept a small, deliberate, purely
# cosmetic 20px rightward shift from legacy rather than adding a primitive
# concept (a column's label anchor independent of its content anchor) that
# nothing else in this file needs. The `reference` sub_line (nab_classic
# only) reads a row key the `references: true` provider param computes —
# NAB's sha256-derived dotted-leader reference number.
_nab_txn_columns_with_reference: &nab_txn_columns_with_reference
  - {key: date, label: Date, align: left, x: 10}
  - {key: description, label: Particulars, align: left, x: 180,
     budget: TRANSACTION_DESC, field: TRANSACTION_DESCRIPTIONS,
     sub_line: {key: reference, role: sub_description, color: "#999999", offset_y: 34, height: 32}}
  - {key: debit, label: Debits, align: right, x_right: -380, field: TRANSACTION_AMOUNTS_PAID}
  - {key: credit, label: Credits, align: right, x_right: -190, field: TRANSACTION_AMOUNTS_RECEIVED}
  - {key: balance, label: Balance, align: right, x_right: -10,
     currency_suffix: "Cr", last_row_field: ACCOUNT_BALANCE}

_nab_txn_columns: &nab_txn_columns
  - {key: date, label: Date, align: left, x: 10}
  - {key: description, label: Particulars, align: left, x: 180,
     budget: TRANSACTION_DESC, field: TRANSACTION_DESCRIPTIONS}
  - {key: debit, label: Debits, align: right, x_right: -380, field: TRANSACTION_AMOUNTS_PAID}
  - {key: credit, label: Credits, align: right, x_right: -190, field: TRANSACTION_AMOUNTS_RECEIVED}
  - {key: balance, label: Balance, align: right, x_right: -10,
     currency_suffix: "Cr", last_row_field: ACCOUNT_BALANCE}

# The "Account Details" box's own interior (heading/payer/BSB/account number)
# records no ground-truth field in the legacy renderer (bank_statement.py:650-665
# — none of those draw calls pass a recorder), so its content below is a
# faithful-but-not-pixel-exact stand-in: legacy right-aligns BSB/Account Number
# as label+value pairs at a fixed offset from the right edge, drawn on the same
# line as the account holder; this uses `pair` (a colon-joined single string)
# in a `split` instead, which is the closest existing primitive vocabulary
# gets. It costs nothing on the equivalence harness either way.
_nab_account_box_children: &nab_account_box_children
  - {type: text, content: "Account Details", role: body, bold: true}
  - {type: pair, label: "Account Holder", value: "{PAYER_NAME}", role: body}
  - type: split
    gap: 20
    children:
      - - {type: pair, label: "BSB Number", value: "082-456", role: sub_description, color: "#666666"}
      - - {type: pair, label: "Account Number", value: "98-765-4321", role: sub_description,
            color: "#666666"}

# Every spacer below corrects a `text` block's own computed `line_height`
# advance up to the legacy renderer's real, unconditional pixel jump (72,
# 150, 170, 40, 52 — see bank_statement.py:645-669), which does not scale
# with font_sizes. Both variants share the same box height (150), the same
# 170px jump to the supplier line, the same 40px supplier-line advance, and
# the same 52px gap before the header bar; only the correction each spacer
# needs to reach that target differs, because nab_classic and nab_dense use
# different font_sizes and therefore different natural line_height() advances.
_nab_classic_body: &nab_classic_body
  - {type: text, content: "NAB Classic Banking", role: header, color: "#003366", bold: true}
  - {type: spacer, height: 11}  # line_height(44)=61 -> legacy's real 72px jump.
  - type: panel
    height: 150
    padding: 18
    border_color: "#003366"
    children: *nab_account_box_children
  - {type: spacer, height: 20}  # legacy jumps to box_top+170, 20px past the box's own bottom.
  - {type: text, content: "{SUPPLIER_NAME}", role: body, color: gray, field: SUPPLIER_NAME}
  - {type: spacer, height: 1}  # line_height(28)=39 -> legacy's real 40px (_draw_supplier_line's line_spacing).
  - {type: text, content: "Transaction Details (continued)", role: body, bold: true}
  - {type: spacer, height: 13}  # line_height(28)=39 -> legacy's real 52px gap before the header bar.
  - type: table
    rows: bank_transactions
    frame: filled
    grouping: dedicated_row
    fill_color: "#E8F0FE"
    fill_inset: 2
    header_height: 50
    fill_height: 44
    label_inset_y: 10
    group_gap: 0
    synthetic_row_placement: after_first_group_header
    params: {brought_forward: true, carried_forward: true, references: true}
    columns: *nab_txn_columns_with_reference

_nab_dense_body: &nab_dense_body
  - {type: text, content: "NAB Classic Banking", role: header, color: "#003366", bold: true}
  - {type: spacer, height: 16}  # line_height(40)=56 -> legacy's real 72px jump.
  - type: panel
    height: 150
    padding: 18
    border_color: "#003366"
    children: *nab_account_box_children
  - {type: spacer, height: 20}  # legacy jumps to box_top+170, 20px past the box's own bottom.
  - {type: text, content: "{SUPPLIER_NAME}", role: body, color: gray, field: SUPPLIER_NAME}
  - {type: spacer, height: 7}  # line_height(24)=33 -> legacy's real 40px (_draw_supplier_line's line_spacing).
  - {type: text, content: "Transaction Details (continued)", role: body, bold: true}
  - {type: spacer, height: 19}  # line_height(24)=33 -> legacy's real 52px gap before the header bar.
  - type: table
    rows: bank_transactions
    frame: filled
    grouping: dedicated_row
    fill_color: "#E8F0FE"
    fill_inset: 2
    header_height: 50
    fill_height: 44
    label_inset_y: 10
    group_gap: 0
    synthetic_row_placement: after_first_group_header
    params: {brought_forward: true, carried_forward: true}
    columns: *nab_txn_columns

layouts:
  cba_standard:
    <<: *cba
    # Per-field pixel budget: transaction description column (= content_width-840).
    # Wrap (not shrink) to keep row font uniform; replaces the old silent char-truncation.
    renderer: cba
    variant: standard
    font_sizes:
      header: 48
      body: 32
      footer: 18
    row_height: 72
    column_headers: ["Date", "Description", "Withdrawal", "Deposit", "Balance"]
    show_opening_balance: true
    show_footer_transaction_types: true
    date_format: "DD/MM/YYYY"
    body:
      - {type: text, content: "{SUPPLIER_NAME}", role: header, color: "#12107D",
         field: SUPPLIER_NAME}
      - type: block
        role: footer
        color: "#666666"
        lines:
          - Commonwealth Bank of Australia
          - ABN 48 123 456 789 AFSL and
          - Australian credit licence 234567
      - {type: spacer, height: 40}
      - {type: pair, label: "Account Holder", value: "{PAYER_NAME}", role: body,
         field: PAYER_NAME}
      - {type: pair, label: "Statement Period", value: "{STATEMENT_DATE_RANGE}", role: body,
         when: STATEMENT_DATE_RANGE, field: STATEMENT_DATE_RANGE}
      - {type: spacer, height: 28}
      - type: table
        rows: bank_transactions
        frame: ruled
        grouping: none
        params: {opening_balance: true}
        columns:
          - {key: date, label: Date, align: left, x: 0}
          - {key: description, label: Description, align: left, x: 200,
             budget: TRANSACTION_DESC, field: TRANSACTION_DESCRIPTIONS}
          - {key: debit, label: Withdrawal, align: right, x_right: -420,
             field: TRANSACTION_AMOUNTS_PAID}
          - {key: credit, label: Deposit, align: right, x_right: -210,
             field: TRANSACTION_AMOUNTS_RECEIVED}
          - {key: balance, label: Balance, align: right, x_right: 0,
             last_row_field: ACCOUNT_BALANCE}
      - {type: spacer, height: 40}
      - {type: text, role: footer, color: "#666666",
         content: "Transaction types: EFTPOS, ATM, Direct Debit, Direct Credit, Transfer"}

  cba_date_grouped:
    <<: *cba
    renderer: cba
    variant: date_grouped
    font_sizes:
      header: 48
      body: 32
      footer: 18
    row_height: 72
    column_headers: ["Date", "Description", "Withdrawal", "Deposit", "Balance"]
    show_opening_balance: true
    show_footer_transaction_types: true
    date_grouping: true
    date_format: "DD MMM YYYY"
    body:
      - {type: text, content: "{SUPPLIER_NAME}", role: header, color: "#12107D",
         field: SUPPLIER_NAME}
      - type: block
        role: footer
        color: "#666666"
        lines:
          - Commonwealth Bank of Australia
          - ABN 48 123 456 789 AFSL and
          - Australian credit licence 234567
      - {type: spacer, height: 40}
      - {type: pair, label: "Account Holder", value: "{PAYER_NAME}", role: body,
         field: PAYER_NAME}
      - {type: pair, label: "Statement Period", value: "{STATEMENT_DATE_RANGE}", role: body,
         when: STATEMENT_DATE_RANGE, field: STATEMENT_DATE_RANGE}
      - {type: spacer, height: 28}
      - type: table
        rows: bank_transactions
        frame: plain
        grouping: dedicated_row
        # plain rows draw no ruled header lines, but legacy CBA always ruled-lines
        # its header (12px rule + 44px labels + 16px rule = 72px) regardless of
        # date_grouping. Override the computed default (line_height(32)=44) to match.
        header_height: 72
        params: {opening_balance: true}
        columns:
          - {key: date, label: Date, align: left, x: 0}
          - {key: description, label: Description, align: left, x: 200,
             budget: TRANSACTION_DESC, field: TRANSACTION_DESCRIPTIONS}
          - {key: debit, label: Withdrawal, align: right, x_right: -420,
             field: TRANSACTION_AMOUNTS_PAID}
          - {key: credit, label: Deposit, align: right, x_right: -210,
             field: TRANSACTION_AMOUNTS_RECEIVED}
          - {key: balance, label: Balance, align: right, x_right: 0,
             last_row_field: ACCOUNT_BALANCE}
      - {type: spacer, height: 40}
      - {type: text, role: footer, color: "#666666",
         content: "Transaction types: EFTPOS, ATM, Direct Debit, Direct Credit, Transfer"}

  westpac_standard:
    <<: *westpac
    renderer: westpac
    variant: standard
    font_sizes: {header: 44, body: 28, sub_description: 22, footer: 16}
    row_height: 62
    date_format: "DD MMM YY"
    body:
      - type: split
        children:
          - - {type: text, content: "{SUPPLIER_NAME}", role: header, color: "#C41E3A", bold: true,
                field: SUPPLIER_NAME}
          - - {type: text, content: "Page 1 of 1", role: footer, align: right, color: "#666666"}
      - {type: text, content: "Transaction Details", role: body, bold: true}
      - {type: spacer, height: 14}
      - {type: pair, label: "Account Holder", value: "{PAYER_NAME}", role: body,
         field: PAYER_NAME}
      - {type: pair, label: "Statement Period", value: "{STATEMENT_DATE_RANGE}", role: sub_description,
         color: "#666666", when: STATEMENT_DATE_RANGE, field: STATEMENT_DATE_RANGE}
      - {type: spacer, height: 41}
      - type: table
        rows: bank_transactions
        frame: bordered
        grouping: none
        header_height: 72
        dividers: *westpac_txn_dividers
        columns: *westpac_txn_columns

  westpac_premium:
    <<: *westpac
    renderer: westpac
    variant: premium
    font_sizes: {header: 44, body: 28, sub_description: 22, footer: 16}
    row_height: 62
    show_rewards_section: true
    date_grouping: true
    date_format: "DD MMM YY"
    body:
      - type: split
        children:
          - - {type: text, content: "{SUPPLIER_NAME}", role: header, color: "#C41E3A", bold: true,
                field: SUPPLIER_NAME}
          - - {type: text, content: "Page 1 of 1", role: footer, align: right, color: "#666666"}
      - {type: spacer, height: 37}
      - type: panel
        height: 260
        padding: 10
        children:
          - type: split
            gap: 30
            divider: true
            children:
              - - type: block
                  role: sub_description
                  heading: "Rewards Points Balance Summary"
                  lines:
                    - "Opening Balance          345,678"
                    - "Points Earned             12,456"
                    - "Bonus Points Earned            0"
                    - "Points Redeemed                0"
                    - "Closing Balance          358,134"
                    - "Points Status          Available"
              - - type: block
                  role: sub_description
                  heading: "A message from Rewards"
                  lines: []
      - {type: text, role: sub_description, color: "#666666",
         content: "To find out more about how Rewards Points are earned, go to the Rewards website."}
      - {type: spacer, height: 24}
      - {type: text, content: "Westpac Premium Card® transactions", role: body, bold: true}
      - {type: spacer, height: 14}
      - {type: pair, label: "Account Holder", value: "{PAYER_NAME}", role: body,
         field: PAYER_NAME}
      - {type: pair, label: "Statement Period", value: "{STATEMENT_DATE_RANGE}", role: sub_description,
         color: "#666666", when: STATEMENT_DATE_RANGE, field: STATEMENT_DATE_RANGE}
      - {type: spacer, height: 10}
      - type: table
        rows: bank_transactions
        frame: bordered
        grouping: inline
        header_height: 72
        dividers: *westpac_txn_dividers
        columns: *westpac_txn_columns

  nab_classic:
    field_budgets:
      TRANSACTION_DESC: {width: 860, fit: wrap, min_font: 10, max_lines: 2}
      SUPPLIER_NAME: {width: 1600, fit: shrink, min_font: 12, max_lines: 1}
    bank: National Australia Bank
    logo_text: NAB Classic Banking
    bank_code: NAB
    renderer: nab
    variant: classic
    page_dimensions:
      width: 1800
      height: 3508
    font_sizes:
      header: 44
      body: 28
      sub_description: 22
      footer: 16
    margin: 80
    content_width: 1600
    row_height: 66
    header_bar_color: "#E8F0FE"
    balance_suffix: "Cr"
    date_grouping: true
    show_references: true
    show_brought_forward: true
    date_format: "DD MMM YYYY"
    body: *nab_classic_body

  nab_dense:
    field_budgets:
      TRANSACTION_DESC: {width: 860, fit: wrap, min_font: 10, max_lines: 2}
      SUPPLIER_NAME: {width: 1600, fit: shrink, min_font: 12, max_lines: 1}
    bank: National Australia Bank
    logo_text: NAB Classic Banking
    bank_code: NAB
    renderer: nab
    variant: dense
    page_dimensions:
      width: 1800
      height: 3508
    font_sizes:
      header: 40
      body: 24
      sub_description: 20
      footer: 14
    margin: 80
    content_width: 1600
    row_height: 52
    header_bar_color: "#E8F0FE"
    balance_suffix: "Cr"
    date_grouping: true
    show_references: false
    show_brought_forward: true
    date_format: "DD MMM YY"
    body: *nab_dense_body

  anz_standard:
    field_budgets:
      TRANSACTION_DESC: {width: 780, fit: wrap, min_font: 10, max_lines: 2}
      SUPPLIER_NAME: {width: 1600, fit: shrink, min_font: 12, max_lines: 1}
    bank: Australia and New Zealand Banking Group
    logo_text: ANZ
    bank_code: ANZ
    renderer: anz
    variant: standard
    page_dimensions:
      width: 1800
      height: 3508
    font_sizes:
      header: 48
      body: 32
      sub_description: 24
      footer: 18
    margin: 100
    content_width: 1600
    row_height: 72
    header_color: "#0061B5"
    balance_suffix_debit: "DR"
    balance_suffix_credit: "CR"
    show_totals_row: true
    show_brought_forward: true
    date_format: "DD/MM/YY"

  anz_modern:
    field_budgets:
      TRANSACTION_DESC: {width: 780, fit: wrap, min_font: 10, max_lines: 2}
      SUPPLIER_NAME: {width: 1600, fit: shrink, min_font: 12, max_lines: 1}
    bank: Australia and New Zealand Banking Group
    logo_text: ANZ
    bank_code: ANZ
    renderer: anz
    variant: modern
    page_dimensions:
      width: 1800
      height: 3508
    font_sizes:
      header: 44
      body: 28
      sub_description: 22
      footer: 16
    margin: 100
    content_width: 1600
    row_height: 62
    header_color: "#0061B5"
    balance_suffix_debit: "DR"
    balance_suffix_credit: "CR"
    show_totals_row: true
    show_brought_forward: true
    date_format: "DD MMM YYYY"
