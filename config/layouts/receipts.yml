layouts:
  receipt_thermal_80mm:
    format: thermal
    width: 420
    margin: 12
    line_height: 20
    font_size: 18
    font_family: monospace
    # Per-field pixel budgets (width = content box = width - 2*margin for centered
    # header fields; line-item desc/amount derived from geometry). fit_text keeps
    # content within these losslessly; see docs/fit_safety_design.md.
    field_budgets:
      SUPPLIER_NAME: {width: 396, fit: shrink_then_wrap, min_font: 10, max_lines: 2}
      BUSINESS_ADDRESS: {width: 396, fit: shrink_then_wrap, min_font: 10, max_lines: 2}
      ABN_LINE: {width: 396, fit: shrink, min_font: 10, max_lines: 1}
      PHONE: {width: 396, fit: shrink, min_font: 10, max_lines: 1}
      LINE_ITEM_DESC: {width: 318, fit: shrink, min_font: 10, max_lines: 1}
      LINE_ITEM_AMOUNT: {width: 70, fit: shrink, min_font: 10, max_lines: 1}
      PAYMENT_ACQUIRER: {width: 396, fit: shrink, min_font: 8, max_lines: 1}
      PAYMENT_LINE: {width: 396, fit: shrink, min_font: 8, max_lines: 1}
    sections:
      - type: header
        name: merchant_header
      - type: separator
      - type: receipt_meta
      - type: separator
      - type: itemized
        name: line_items
      - type: separator
      - type: totals
      - type: separator
      - type: payment
      - type: separator
      - type: footer
        text: "Thank you for shopping with us"

