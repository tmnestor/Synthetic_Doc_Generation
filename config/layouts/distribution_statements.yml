layouts:
  # ── Archetype 1: accounting-software statement ───────────────────────────
  dist_software_navy:
    format: distribution_statement
    page_dimensions:
      width: 1600
      height: 3508
    margin: 140
    field_budgets:
      TEXT_VALUE: {width: 1272, fit: wrap, min_font: 12, max_lines: 2}
      AMOUNT_VALUE: {width: 500, fit: shrink, min_font: 12, max_lines: 1}
      COLUMN_TEXT_LEFT: {width: 652, fit: wrap, min_font: 12, max_lines: 2}
      COLUMN_TEXT_RIGHT: {width: 612, fit: wrap, min_font: 12, max_lines: 2}
      ADDRESSEE_VALUE: {width: 1312, fit: wrap, min_font: 12, max_lines: 2}
    font_sizes:
      header: 44
      subheader: 28
      body: 22
      small: 18
      label_code: 26
    colors:
      header_color: "#1A1A2E"
      accent_color: "#16213E"
      line_color: "#CCCCCC"
    sections:
      - type: letterhead
        title: "Statement of Distribution"
        subtitle: "Trust Distribution Advice"
        height: 120
      - type: spacer
        height: 30
      - type: section
        name: trust_details
        title: "Trust Details"
        fields:
          - label: "Trust name"
            field: TRUST_NAME
          - label: "ABN"
            field: TRUST_ABN
          - label: "Address"
            field: TRUST_ADDRESS
      - type: separator
        height: 20
      - type: section
        name: beneficiary_details
        title: "Beneficiary Details"
        fields:
          - label: "Beneficiary name"
            field: BENEFICIARY_NAME
          - label: "TFN"
            field: BENEFICIARY_TFN
          - label: "Address"
            field: BENEFICIARY_ADDRESS
      - type: separator
        height: 20
      - type: section
        name: period
        title: "Distribution Period"
        fields:
          - label: "Income year"
            field: INCOME_YEAR
          - label: "Date of distribution"
            field: DATE_OF_DISTRIBUTION
      - type: separator
        height: 20
      - type: section
        name: distribution_components
        title: "Distribution Components"
        fields:
          - label: "Share of net income"
            field: SHARE_OF_NET_INCOME
            format: amount
          - label: "Franking credit"
            field: FRANKING_CREDIT
            format: amount
          - label: "Capital gain component"
            field: CAPITAL_GAIN_COMPONENT
            format: amount
          - label: "Foreign income"
            field: FOREIGN_INCOME
            format: amount
          - label: "Tax-free amount"
            field: TAX_FREE_AMOUNT
            format: amount
          - label: "Tax-deferred amount"
            field: TAX_DEFERRED_AMOUNT
            format: amount
      - type: separator
        height: 30
      - type: declaration
        text: "This statement has been prepared by the trustee of the above trust and is provided to the beneficiary for inclusion in their individual income tax return."
        height: 80
      - type: footer
        text: "This is not a tax invoice"

  dist_software_teal:
    format: distribution_statement
    page_dimensions:
      width: 1600
      height: 3508
    margin: 140
    field_budgets:
      TEXT_VALUE: {width: 1272, fit: wrap, min_font: 12, max_lines: 2}
      AMOUNT_VALUE: {width: 500, fit: shrink, min_font: 12, max_lines: 1}
      COLUMN_TEXT_LEFT: {width: 652, fit: wrap, min_font: 12, max_lines: 2}
      COLUMN_TEXT_RIGHT: {width: 612, fit: wrap, min_font: 12, max_lines: 2}
      ADDRESSEE_VALUE: {width: 1312, fit: wrap, min_font: 12, max_lines: 2}
    font_sizes:
      header: 40
      subheader: 26
      body: 22
      small: 18
      label_code: 26
    colors:
      header_bg: "#0B6E6E"
      header_text: "#FFFFFF"
      accent_color: "#0B6E6E"
      line_color: "#CCCCCC"
    sections:
      - type: header_bar
        text: "Trust Distribution Statement"
        subtext: "Beneficiary Tax Advice"
        height: 100
      - type: spacer
        height: 40
      - type: two_column
        left:
          title: "Trust"
          fields:
            - label: "Trust"
              field: TRUST_NAME
            - label: "Australian Business Number"
              field: TRUST_ABN
            - label: "Registered address"
              field: TRUST_ADDRESS
        right:
          title: "Beneficiary"
          fields:
            - label: "Name"
              field: BENEFICIARY_NAME
            - label: "Tax file number"
              field: BENEFICIARY_TFN
            - label: "Postal address"
              field: BENEFICIARY_ADDRESS
      - type: separator
        height: 20
      - type: section
        name: period
        title: "Financial Year"
        fields:
          - label: "Financial year"
            field: INCOME_YEAR
          - label: "Date prepared"
            field: DATE_OF_DISTRIBUTION
      - type: separator
        height: 20
      - type: section
        name: distribution_components
        title: "Your Distribution"
        fields:
          - label: "Net income distributed"
            field: SHARE_OF_NET_INCOME
            format: amount
          - label: "Franking credits attached"
            field: FRANKING_CREDIT
            format: amount
          - label: "Net capital gain"
            field: CAPITAL_GAIN_COMPONENT
            format: amount
          - label: "Foreign source income"
            field: FOREIGN_INCOME
            format: amount
          - label: "Tax-free distribution"
            field: TAX_FREE_AMOUNT
            format: amount
          - label: "Tax-deferred distribution"
            field: TAX_DEFERRED_AMOUNT
            format: amount
      - type: footer
        text: "Generated by trustee accounting software"

  # ── Archetype 2: tabular / grid statement ────────────────────────────────
  dist_table_plain:
    format: distribution_statement
    page_dimensions:
      width: 1600
      height: 3508
    margin: 140
    field_budgets:
      TEXT_VALUE: {width: 1272, fit: wrap, min_font: 12, max_lines: 2}
      AMOUNT_VALUE: {width: 500, fit: shrink, min_font: 12, max_lines: 1}
      COLUMN_TEXT_LEFT: {width: 652, fit: wrap, min_font: 12, max_lines: 2}
      COLUMN_TEXT_RIGHT: {width: 612, fit: wrap, min_font: 12, max_lines: 2}
      ADDRESSEE_VALUE: {width: 1312, fit: wrap, min_font: 12, max_lines: 2}
      # Table column geometry: Component col 1000px (desc width 1000-8=992);
      # Amount col 320px right-anchored at x_right-20 (usable 320-20=300).
      DESC_COL: {width: 992, fit: wrap, min_font: 12, max_lines: 2}
      TABLE_AMOUNT: {width: 300, fit: shrink, min_font: 12, max_lines: 1}
    font_sizes:
      header: 42
      subheader: 26
      body: 22
      small: 18
      label_code: 26
    colors:
      header_color: "#222222"
      accent_color: "#444444"
      line_color: "#BBBBBB"
      section_bg: "#F4F4F4"
      header_row: "#ECECEC"
    sections:
      - type: letterhead
        title: "Distribution Statement"
        subtitle: ""
        height: 110
      - type: spacer
        height: 20
      - type: section
        name: trust_details
        title: "Trust"
        fields:
          - label: "Name of trust"
            field: TRUST_NAME
          - label: "ABN"
            field: TRUST_ABN
          - label: "Address"
            field: TRUST_ADDRESS
      - type: section
        name: beneficiary_details
        title: "Beneficiary"
        fields:
          - label: "Name"
            field: BENEFICIARY_NAME
          - label: "Tax file number"
            field: BENEFICIARY_TFN
          - label: "Income year"
            field: INCOME_YEAR
      - type: spacer
        height: 10
      - type: table
        title: "Distribution Components"
        columns:
          - header: "Component"
            width: 1000
            kind: description
          - header: "Amount $"
            width: 320
            kind: amount
        rows:
          - description: "Income entitlement"
            field: SHARE_OF_NET_INCOME
          - description: "Imputation credit"
            field: FRANKING_CREDIT
          - description: "Share of capital gains"
            field: CAPITAL_GAIN_COMPONENT
          - description: "Assessable foreign income"
            field: FOREIGN_INCOME
          - description: "Tax-free amount"
            field: TAX_FREE_AMOUNT
          - description: "Tax-deferred amount"
            field: TAX_DEFERRED_AMOUNT
      - type: footer
        text: "Retain for your records"

  dist_table_ruled:
    format: distribution_statement
    page_dimensions:
      width: 1600
      height: 3508
    margin: 140
    field_budgets:
      TEXT_VALUE: {width: 1272, fit: wrap, min_font: 12, max_lines: 2}
      AMOUNT_VALUE: {width: 500, fit: shrink, min_font: 12, max_lines: 1}
      COLUMN_TEXT_LEFT: {width: 652, fit: wrap, min_font: 12, max_lines: 2}
      COLUMN_TEXT_RIGHT: {width: 612, fit: wrap, min_font: 12, max_lines: 2}
      ADDRESSEE_VALUE: {width: 1312, fit: wrap, min_font: 12, max_lines: 2}
      # Table column geometry: Code col 140px + Description col 860px (desc width
      # 860-8=852); Amount col 320px right-anchored at x_right-20 (usable 320-20=300).
      DESC_COL: {width: 852, fit: wrap, min_font: 12, max_lines: 2}
      TABLE_AMOUNT: {width: 300, fit: shrink, min_font: 12, max_lines: 1}
    font_sizes:
      header: 40
      subheader: 26
      body: 22
      small: 18
      label_code: 26
    colors:
      header_bg: "#3A3A3A"
      header_text: "#FFFFFF"
      accent_color: "#3A3A3A"
      line_color: "#999999"
      section_bg: "#EDEDED"
      header_row: "#DDDDDD"
      label_code_color: "#0066CC"
    sections:
      - type: header_bar
        text: "Trust Income Distribution"
        subtext: "Annual Statement"
        height: 100
      - type: spacer
        height: 40
      - type: two_column
        left:
          title: "Trust"
          fields:
            - label: "Trust name"
              field: TRUST_NAME
            - label: "ABN"
              field: TRUST_ABN
        right:
          title: "Beneficiary"
          fields:
            - label: "Beneficiary"
              field: BENEFICIARY_NAME
            - label: "TFN"
              field: BENEFICIARY_TFN
      - type: section
        name: period
        title: "Period"
        fields:
          - label: "Year ended 30 June"
            field: INCOME_YEAR
      - type: spacer
        height: 10
      - type: table
        title: "Statement of Entitlement"
        columns:
          - header: "Code"
            width: 140
            kind: label_code
          - header: "Description"
            width: 860
            kind: description
          - header: "Amount $"
            width: 320
            kind: amount
        rows:
          - label_code: "Q"
            description: "Franking credit"
            field: FRANKING_CREDIT
          - label_code: "M"
            description: "Net capital gain"
            field: CAPITAL_GAIN_COMPONENT
          - label_code: "C"
            description: "Foreign income"
            field: FOREIGN_INCOME
          - label_code: "R"
            description: "Tax-free amount"
            field: TAX_FREE_AMOUNT
          - label_code: "T"
            description: "Tax-deferred amount"
            field: TAX_DEFERRED_AMOUNT
        total_row:
          label: "Net income share"
          field: SHARE_OF_NET_INCOME
      - type: footer
        text: "Sensitive (when completed)"

  # ── Archetype 3: simple trustee letter ───────────────────────────────────
  dist_letter_formal:
    format: distribution_statement
    page_dimensions:
      width: 1600
      height: 3508
    margin: 160
    field_budgets:
      TEXT_VALUE: {width: 1232, fit: wrap, min_font: 12, max_lines: 2}
      AMOUNT_VALUE: {width: 500, fit: shrink, min_font: 12, max_lines: 1}
      COLUMN_TEXT_LEFT: {width: 632, fit: wrap, min_font: 12, max_lines: 2}
      COLUMN_TEXT_RIGHT: {width: 592, fit: wrap, min_font: 12, max_lines: 2}
      ADDRESSEE_VALUE: {width: 1272, fit: wrap, min_font: 12, max_lines: 2}
      PARAGRAPH: {width: 1280, fit: wrap, min_font: 12, max_lines: 1}
    font_sizes:
      header: 38
      subheader: 26
      body: 24
      small: 18
      label_code: 26
    colors:
      header_color: "#2B2B2B"
      accent_color: "#2B2B2B"
      line_color: "#CCCCCC"
    sections:
      - type: letterhead
        title: "Office of the Trustee"
        subtitle: "Trust Distribution Advice"
        height: 120
      - type: spacer
        height: 20
      - type: letter_meta
        date_field: DATE_OF_DISTRIBUTION
        addressee_fields:
          - BENEFICIARY_NAME
          - BENEFICIARY_ADDRESS
        salutation: "Dear {BENEFICIARY_NAME},"
      - type: letter_body
        paragraphs:
          - "We write to advise of your entitlement as a beneficiary of the {TRUST_NAME} for the income year {INCOME_YEAR}."
          - "The components of your distribution are set out below. Please retain this advice for inclusion in your individual income tax return."
      - type: spacer
        height: 10
      - type: section
        name: identity
        title: "Reference"
        fields:
          - label: "Trust ABN"
            field: TRUST_ABN
          - label: "Your tax file number"
            field: BENEFICIARY_TFN
      - type: section
        name: distribution_components
        title: "Distribution Components"
        fields:
          - label: "Share of net income"
            field: SHARE_OF_NET_INCOME
            format: amount
          - label: "Franking credit"
            field: FRANKING_CREDIT
            format: amount
          - label: "Capital gain component"
            field: CAPITAL_GAIN_COMPONENT
            format: amount
          - label: "Foreign income"
            field: FOREIGN_INCOME
            format: amount
          - label: "Tax-free amount"
            field: TAX_FREE_AMOUNT
            format: amount
          - label: "Tax-deferred amount"
            field: TAX_DEFERRED_AMOUNT
            format: amount
      - type: signature_block
        gap: 30
        lines:
          - "Yours faithfully,"
          - "Trustee, {TRUST_NAME}"
      - type: footer
        text: "This is not a tax invoice"

  dist_letter_compact:
    format: distribution_statement
    page_dimensions:
      width: 1600
      height: 3508
    margin: 160
    field_budgets:
      TEXT_VALUE: {width: 1232, fit: wrap, min_font: 12, max_lines: 2}
      AMOUNT_VALUE: {width: 500, fit: shrink, min_font: 12, max_lines: 1}
      COLUMN_TEXT_LEFT: {width: 632, fit: wrap, min_font: 12, max_lines: 2}
      COLUMN_TEXT_RIGHT: {width: 592, fit: wrap, min_font: 12, max_lines: 2}
      ADDRESSEE_VALUE: {width: 1272, fit: wrap, min_font: 12, max_lines: 2}
      PARAGRAPH: {width: 1280, fit: wrap, min_font: 12, max_lines: 1}
    font_sizes:
      header: 34
      subheader: 24
      body: 24
      small: 18
      label_code: 26
    colors:
      header_color: "#333333"
      accent_color: "#555555"
      line_color: "#CCCCCC"
    sections:
      - type: letterhead
        title: "Trust Distribution Advice"
        subtitle: ""
        height: 120
      - type: letter_meta
        date_field: DATE_OF_DISTRIBUTION
        addressee_fields:
          - BENEFICIARY_NAME
        salutation: "Dear {BENEFICIARY_NAME},"
      - type: letter_body
        paragraphs:
          - "Your distribution from the {TRUST_NAME} for {INCOME_YEAR} is summarised below. Trust ABN: {TRUST_ABN}. Your TFN: {BENEFICIARY_TFN}."
      - type: spacer
        height: 10
      - type: section
        name: distribution_components
        title: "Summary"
        fields:
          - label: "Income entitlement"
            field: SHARE_OF_NET_INCOME
            format: amount
          - label: "Franking credit"
            field: FRANKING_CREDIT
            format: amount
          - label: "Capital gains"
            field: CAPITAL_GAIN_COMPONENT
            format: amount
          - label: "Foreign income"
            field: FOREIGN_INCOME
            format: amount
          - label: "Tax-free amount"
            field: TAX_FREE_AMOUNT
            format: amount
          - label: "Tax-deferred amount"
            field: TAX_DEFERRED_AMOUNT
            format: amount
      - type: signature_block
        gap: 20
        lines:
          - "Trustee, {TRUST_NAME}"
      - type: footer
        text: "Retain for your records"
