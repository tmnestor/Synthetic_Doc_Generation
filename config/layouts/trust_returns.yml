layouts:
  trust_return_standard:
    format: trust_return
    page_dimensions:
      width: 2480
      height: 3508
    margin: 120
    font_sizes:
      header: 40
      subheader: 28
      body: 22
      small: 18
      item_number: 24
    colors:
      header_bg: "#4A4A4A"
      header_text: "#FFFFFF"
      section_bg: "#F0F0F0"
      item_number_color: "#333333"
    sections:
      - type: header_bar
        text: "Trust tax return 2024"
        subtext: "NAT 0660"
        height: 100
      - type: spacer
        height: 40
      - type: section
        name: trust_identity
        title: "Trust identity"
        fields:
          - label: "Name of trust"
            field: TRUST_NAME
          - label: "Tax file number (TFN)"
            field: TRUST_TFN
            format: digit_boxes
          - label: "Australian business number (ABN)"
            field: TRUST_ABN
            format: digit_boxes
          - label: "Name of trustee"
            field: TRUSTEE_NAME
          - label: "Address of trustee"
            field: TRUST_ADDRESS
          - label: "Income year"
            field: INCOME_YEAR
      - type: separator
        height: 30
      - type: section
        name: total_net_income
        title: "Calculation statement"
        fields:
          - label: "Item 55  Total net income or loss"
            field: TOTAL_NET_INCOME
            format: amount
            item_number: "55"
      - type: separator
        height: 30
      - type: section
        name: statement_of_distribution
        title: "Statement of distribution"
        subtitle: "Item 57 — Share of net income"
        fields:
          - label: "Beneficiary name"
            field: BENEFICIARY_NAME
          - label: "TFN of beneficiary"
            field: BENEFICIARY_TFN
            format: digit_boxes
          - label: "Item 57  Share of net income"
            field: SHARE_OF_NET_INCOME
            format: amount
            item_number: "57"
          - label: "Item 58  Franking credit"
            field: FRANKING_CREDIT
            format: amount
            item_number: "58"
          - label: "Capital gain component"
            field: CAPITAL_GAIN_COMPONENT
            format: amount
          - label: "Foreign income"
            field: FOREIGN_INCOME
            format: amount
      - type: footer
        text: "Sensitive (when completed)"
        height: 40
