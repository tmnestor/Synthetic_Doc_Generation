layouts:
  tax_invoice_standard:
    format: tax_invoice
    page_dimensions:
      width: 1900
      height: 3508
    margin: 100
    content_width: 1700
    font_family: sans-serif
    # Per-field pixel budgets: header/bill-to fields use the content box (1700px);
    # the line-item description column is 900px wide (see col_x in invoice.py).
    field_budgets:
      SUPPLIER_NAME: {width: 1700, fit: shrink_then_wrap, min_font: 12, max_lines: 2}
      BUSINESS_ADDRESS: {width: 1700, fit: shrink_then_wrap, min_font: 12, max_lines: 2}
      ABN_LINE: {width: 1700, fit: shrink, min_font: 12, max_lines: 1}
      PAYER_NAME: {width: 1700, fit: shrink_then_wrap, min_font: 12, max_lines: 2}
      PAYER_ADDRESS: {width: 1700, fit: shrink_then_wrap, min_font: 12, max_lines: 2}
      LINE_ITEM_DESC: {width: 870, fit: shrink, min_font: 12, max_lines: 1}
    font_sizes:
      header: 48
      subheader: 28
      body: 20
      footer: 16
    sections:
      - type: header
        name: invoice_title
        height: 80
        font_size: 28
        font_weight: bold
        text: "TAX INVOICE"
        alignment: center
      - type: separator
        height: 20
      - type: section
        name: seller_details
        label: "From:"
        height: 120
        font_size: 11
        fields:
          - business_name
          - abn_number
          - business_address
          - business_phone
          - business_email
      - type: section
        name: buyer_details
        label: "Bill To:"
        height: 120
        font_size: 11
        fields:
          - customer_name
          - customer_address
          - customer_phone
      - type: section
        name: invoice_metadata
        height: 80
        font_size: 11
        fields:
          - invoice_number
          - invoice_date
          - due_date
          - order_number
      - type: separator
        height: 20
      - type: table
        name: line_items_table
        columns:
          - name: item_number
            header_text: "#"
            width: 80
            font_size: 10
          - name: description
            header_text: "Description"
            width: 800
            font_size: 11
          - name: quantity
            header_text: "Qty"
            width: 120
            font_size: 10
          - name: unit_price
            header_text: "Unit Price"
            width: 200
            font_size: 10
          - name: tax_code
            header_text: "Tax"
            width: 150
            font_size: 10
          - name: total_price
            header_text: "Total"
            width: 200
            font_size: 10
        row_height: 30
        table_start_y: 1800
      - type: separator
        height: 20
      - type: totals
        name: totals
        fields:
          - name: subtotal
            label: "Subtotal (excl. GST):"
            font_size: 11
          - name: gst_amount
            label: "GST (10%):"
            font_size: 11
          - name: total
            label: "TOTAL (incl. GST):"
            font_size: 13
            font_weight: bold
      - type: section
        name: payment_terms
        label: "Payment Terms:"
        height: 60
        font_size: 10
        fields:
          - payment_method
          - bsb_number
          - account_number
          - account_name
      - type: footer
        name: footer_text
        height: 40
        font_size: 9
        alignment: center

