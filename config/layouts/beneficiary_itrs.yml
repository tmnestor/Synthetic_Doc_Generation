layouts:
  beneficiary_itr_standard:
    format: beneficiary_itr
    page_dimensions:
      width: 1600
      height: 3508
    margin: 120
    font_sizes:
      header: 40
      subheader: 28
      body: 22
      small: 18
      item_number: 24
    colors:
      header_bg: "#4A4A4A"
      header_text: "#FFFFFF"
      section_bg: "#F0F0F0"
      item_number_color: "#333333"
    sections:
      - type: header_bar
        text: "Tax return for individuals 2024"
        subtext: "NAT 2541"
        height: 100
      - type: spacer
        height: 40
      - type: section
        name: individual_identity
        title: "Your details"
        fields:
          - label: "Title and full name"
            field: INDIVIDUAL_NAME
          - label: "Tax file number"
            field: INDIVIDUAL_TFN
            format: digit_boxes
          - label: "Date of birth"
            field: DATE_OF_BIRTH
          - label: "Home address"
            field: INDIVIDUAL_ADDRESS
      - type: separator
        height: 30
      - type: section
        name: item_13_trusts
        title: "Item 13 — Partnerships and trusts"
        subtitle: "Share of income from trusts"
        fields:
          - label: "Total trust income"
            field: TOTAL_TRUST_INCOME
            format: amount
            item_number: "13"
            label_code: "U"
          - label: "Share of franking credit from trusts"
            field: TRUST_FRANKING_CREDIT
            format: amount
            label_code: "Q"
      - type: footer
        text: "Sensitive (when completed)"
        height: 40
