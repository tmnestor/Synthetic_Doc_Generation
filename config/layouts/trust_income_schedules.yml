layouts:
  trust_income_schedule_standard:
    format: trust_income_schedule
    page_dimensions:
      width: 1600
      height: 3508
    margin: 120
    font_sizes:
      header: 40
      subheader: 28
      body: 22
      small: 18
      label_code: 26
    colors:
      header_bg: "#4A4A4A"
      header_text: "#FFFFFF"
      section_bg: "#F0F0F0"
      grid_line: "#CCCCCC"
      label_code_color: "#0066CC"
    field_budgets:
      TEXT_VALUE: {width: 1332, fit: wrap, min_font: 12, max_lines: 2}
      DESC_COL: {width: 792, fit: wrap, min_font: 12, max_lines: 2}
      AMOUNT_VALUE: {width: 452, fit: shrink, min_font: 12, max_lines: 1}
    sections:
      - type: header_bar
        text: "Trust income schedule 2024"
        subtext: "NAT 3890"
        height: 100
      - type: spacer
        height: 40
      - type: section
        name: beneficiary_identity
        title: "Beneficiary identity"
        fields:
          - label: "Name of beneficiary"
            field: BENEFICIARY_NAME
          - label: "Tax file number"
            field: BENEFICIARY_TFN
            format: digit_boxes
      - type: separator
        height: 20
      - type: section
        name: trust_identity
        title: "Trust identity"
        fields:
          - label: "Name of trust"
            field: TRUST_NAME
          - label: "ABN of trust"
            field: TRUST_ABN
      - type: separator
        height: 20
      - type: grid_section
        name: distribution_details
        title: "Distribution details"
        columns:
          - header: "Label"
            width: 100
          - header: "Description"
            width: 800
          - header: "Amount $"
            width: 460
        rows:
          - label_code: "U"
            description: "Share of net income"
            field: SHARE_OF_NET_INCOME
            format: amount
          - label_code: "Q"
            description: "Franking credit"
            field: FRANKING_CREDIT
            format: amount
          - label_code: "M"
            description: "Capital gains — discounted"
            field: CAPITAL_GAIN_COMPONENT
            format: amount
          - label_code: "C"
            description: "Foreign income"
            field: FOREIGN_INCOME
            format: amount
      - type: footer
        text: "Sensitive (when completed)"
        height: 40
