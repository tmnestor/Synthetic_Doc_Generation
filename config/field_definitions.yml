# Field definitions for synthetic business document benchmark.
# 23 columns: 20 base + 3 CC-specific.

document_fields:
  bank_statement:
    - DOCUMENT_TYPE
    - SUPPLIER_NAME
    - STATEMENT_DATE_RANGE
    - TRANSACTION_DATES
    - TRANSACTION_DESCRIPTIONS
    - TRANSACTION_AMOUNTS_PAID
    - TRANSACTION_AMOUNTS_RECEIVED
    - ACCOUNT_BALANCE
    - PAYER_NAME

  receipt:
    - DOCUMENT_TYPE
    - SUPPLIER_NAME
    - BUSINESS_ABN
    - BUSINESS_ADDRESS
    - INVOICE_DATE
    - IS_GST_INCLUDED
    - GST_AMOUNT
    - TOTAL_AMOUNT
    - LINE_ITEM_DESCRIPTIONS
    - LINE_ITEM_QUANTITIES
    - LINE_ITEM_PRICES
    - LINE_ITEM_TOTAL_PRICES

  invoice:
    - DOCUMENT_TYPE
    - SUPPLIER_NAME
    - BUSINESS_ABN
    - BUSINESS_ADDRESS
    - INVOICE_DATE
    - IS_GST_INCLUDED
    - GST_AMOUNT
    - TOTAL_AMOUNT
    - LINE_ITEM_DESCRIPTIONS
    - LINE_ITEM_QUANTITIES
    - LINE_ITEM_PRICES
    - LINE_ITEM_TOTAL_PRICES
    - PAYER_NAME
    - PAYER_ADDRESS

  cc_statement:
    - DOCUMENT_TYPE
    - SUPPLIER_NAME
    - STATEMENT_DATE_RANGE
    - TRANSACTION_DATES
    - TRANSACTION_DESCRIPTIONS
    - TRANSACTION_AMOUNTS_PAID
    - ACCOUNT_BALANCE
    - CREDIT_LIMIT
    - MINIMUM_PAYMENT
    - PAYMENT_DUE_DATE
    - PAYER_NAME

all_columns:
  - DOCUMENT_TYPE
  - SUPPLIER_NAME
  - BUSINESS_ABN
  - BUSINESS_ADDRESS
  - GST_AMOUNT
  - INVOICE_DATE
  - IS_GST_INCLUDED
  - LINE_ITEM_DESCRIPTIONS
  - LINE_ITEM_QUANTITIES
  - LINE_ITEM_PRICES
  - LINE_ITEM_TOTAL_PRICES
  - PAYER_ADDRESS
  - PAYER_NAME
  - STATEMENT_DATE_RANGE
  - TOTAL_AMOUNT
  - TRANSACTION_AMOUNTS_PAID
  - TRANSACTION_DATES
  - TRANSACTION_DESCRIPTIONS
  - TRANSACTION_AMOUNTS_RECEIVED
  - ACCOUNT_BALANCE
  - CREDIT_LIMIT
  - MINIMUM_PAYMENT
  - PAYMENT_DUE_DATE

document_type_values:
  - BANK_STATEMENT
  - RECEIPT
  - INVOICE
  - CC_STATEMENT

field_formats:
  date: "DD/MM/YYYY"
  amount: "decimal without $ prefix"
  boolean: "true / false"
  list: "pipe-delimited (item1|item2|item3)"
  not_found: "NOT_FOUND"

field_types:
  date:
    - INVOICE_DATE
    - PAYMENT_DUE_DATE
  date_range:
    - STATEMENT_DATE_RANGE
  amount:
    - GST_AMOUNT
    - TOTAL_AMOUNT
    - ACCOUNT_BALANCE
    - CREDIT_LIMIT
    - MINIMUM_PAYMENT
  amount_list:
    - TRANSACTION_AMOUNTS_PAID
    - TRANSACTION_AMOUNTS_RECEIVED
    - LINE_ITEM_PRICES
    - LINE_ITEM_TOTAL_PRICES
  date_list:
    - TRANSACTION_DATES
  text_list:
    - LINE_ITEM_DESCRIPTIONS
    - TRANSACTION_DESCRIPTIONS
    - LINE_ITEM_QUANTITIES
  boolean:
    - IS_GST_INCLUDED
  abn:
    - BUSINESS_ABN
