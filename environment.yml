# =============================================================================
# PORTABLE ENVIRONMENT (no build strings) — cross-platform (macOS + Linux GPU)
# =============================================================================
#
# This is the canonical environment file: version-pinned but build-agnostic, so
# conda can resolve platform-appropriate builds on both macOS (dev) and the
# remote Linux GPU server (inference). For byte-for-byte local reproduction on
# osx-arm64, use environment.lock.yml (fully pinned with build hashes).
#
# Environment Location (macOS):
# /opt/homebrew/Caskroom/miniforge/base/envs/synthetic
#
# CREATE: Create environment from this file
# conda env create -f environment.yml
#
# READ: List all environments
# conda env list
# conda list  # Show packages in active environment
#
# UPDATE: Update existing environment from file
# conda env update -f environment.yml --prune
#
# DELETE: Remove environment
# conda env remove -n synthetic
#
# ACTIVATE: Activate environment
# conda activate synthetic
# conda activate /opt/homebrew/Caskroom/miniforge/base/envs/synthetic
#
# DEACTIVATE: Deactivate environment
# conda deactivate
#
# EXPORT (regenerate this portable file):
# conda env export -n synthetic --no-builds | grep -v '^prefix:' > environment.yml
#
# EXPORT (regenerate the pinned lock file):
# conda env export -n synthetic | grep -v '^prefix:' > environment.lock.yml
#
# CLONE: Create copy of environment
# conda create --name new_env --clone synthetic
# =============================================================================
