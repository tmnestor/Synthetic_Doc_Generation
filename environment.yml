# Shared conda environment for the synthetic document generator.
#
# TEAM MEMBERS: you only LOAD this env — activate it by path, nothing to build:
#     conda activate /efs/shared/.conda/envs/synthetic
#
# The spec below is the build recipe, used only by the env's maintainer to
# create/refresh it at that shared prefix. There is no `name:`/`prefix:` key:
# `conda env create` ignores a `prefix:` key, and a `name:` key is mutually
# exclusive with the `--prefix` flag the maintainer uses to install into the
# shared location.
#
# Package sources come from the host's config (kept OUT of this repo):
#   - Python interpreter -> conda, from the channel in ~/.condarc
#   - Libraries          -> pip, from the index in ~/.pip/pip.conf
# On the locked-down PROD remote these point at the internal Artifactory conda
# and PyPI mirrors; the public repos are unreachable there.
dependencies:
  # Python 3.12 is the only hard version requirement.
  - python=3.12
  - pip
  - pip:
      # Document generation runtime (the generators/ pipeline).
      # Pinned: Pillow's FreeType version drives font getbbox() metrics, which
      # drive every fit_text() shrink/wrap decision and the rendered pixels.
      # Pinning keeps images and fit results byte-stable across rebuilds / Mac<->PROD.
      - pillow==12.2.0
      # Capped at <=2.4 by numba, which augraphy imports unconditionally.
      # Pinned exactly so the cap is visible rather than resolved silently.
      - numpy==2.3.5
      - pyyaml
      - typer
      - rich
      # Synthetic content generation for reseeding (scripts/seed_*.py).
      # Pinned: faker's version determines generated content, so pinning keeps
      # reseeded ground truth reproducible across rebuilds.
      - faker==40.8.0
      # Perspective warp for receipt degradation (generators/degradation/camera.py)
      # and the offline rectifier (rectify_camera_scan.py). Pinned so camera-scan
      # output stays byte-stable across rebuilds.
      - opencv-python-headless==4.13.0.92
      # Document-image degradation for receipts (generators/degradation/).
      # MUST be installed with --no-deps: augraphy declares `opencv-python`
      # (the full GUI build), which would displace the headless build pinned
      # above and pull GUI system libraries into locked-down PROD. Its real
      # transitive requirements are therefore listed explicitly below.
      - augraphy==8.2.6
      - numba
      - llvmlite
      - scikit-image
      - scikit-learn
      - lazy_loader
      - imageio
      - tifffile
      - networkx
      - joblib
      - threadpoolctl
      - narwhals
      # These four are import-time only. `import augraphy` loads every
      # augmentation module, two of which use HTTP (Scribbles fetches fonts by
      # URL; the Figshare downloader pulls datasets) -- neither is in the
      # allow-list in generators/degradation/augment.py, so the pipeline makes
      # no network calls and works air-gapped.
      - requests
      - urllib3
      - idna
      - certifi
      # Never executed -- it decodes HTTP response bodies that are never
      # fetched -- but not droppable: pip enforces it as a hard (non-extra)
      # requirement of `requests`. Listed explicitly so the mirror request
      # covers it rather than discovering it as a resolution failure.
      - charset-normalizer
      # Tree-edit-distance backend for the vendored CORD evaluator
      # (generators/exporters/cord_eval.py). MIT-licensed; used in place of
      # zss (non-SPDX/historically GPL) per docs/GroundTruth_Export_Spec.md.
      - apted
      # Fuzzy string-edit-distance for leaf-node rename cost in cord_eval.py
      # (replaces donut's nltk.edit_distance). MIT-licensed.
      - rapidfuzz
      # Published DocILE KILE/LIR scorer (generators/exporters/docile.py self-score
      # tests). Resolved cleanly with a plain `pip install` dry run: no ancient
      # datasets/pyarrow/numpy pulled in (unlike donut-python's backtrack to
      # numpy 1.19.4), and every dependency ships a py3.12/arm64 wheel. Apache-2.0.
      - docile-benchmark
