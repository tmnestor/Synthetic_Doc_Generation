name: synthetic
channels:
  - conda-forge
dependencies:
  # Python 3.12 is the only hard version requirement; other packages float.
  - python=3.12
  # Document generation runtime (see generators/ and the camera-scan scripts).
  - pillow
  - numpy
  - pyyaml
  - typer
  - rich
  - pip
  - pip:
      # cv2 — used by degrade_camera_scan.py / rectify_camera_scan.py.
      - opencv-python-headless

# =============================================================================
# CONDA ENVIRONMENT — QUICK REFERENCE
# =============================================================================
#
# CREATE:   conda env create -f environment.yml
# UPDATE:   conda env update -f environment.yml --prune
# ACTIVATE: conda activate synthetic
# REMOVE:   conda env remove -n synthetic
# EXPORT:   conda env export -n synthetic --no-builds | grep -v '^prefix:' > environment.yml
# =============================================================================
