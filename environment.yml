# Shared conda environment for the synthetic document generator.
#
# TEAM MEMBERS: you only LOAD this env — activate it by path, nothing to build:
#     conda activate /efs/shared/.conda/envs/synthetic
#
# The spec below is the build recipe, used only by the env's maintainer to
# create/refresh it at that shared prefix. There is no `name:`/`prefix:` key:
# `conda env create` ignores a `prefix:` key, and a `name:` key is mutually
# exclusive with the `--prefix` flag the maintainer uses to install into the
# shared location.
#
# Package sources come from the host's config (kept OUT of this repo):
#   - Python interpreter -> conda, from the channel in ~/.condarc
#   - Libraries          -> pip, from the index in ~/.pip/pip.conf
# On the locked-down PROD remote these point at the internal Artifactory conda
# and PyPI mirrors; the public repos are unreachable there.
dependencies:
  # Python 3.12 is the only hard version requirement.
  - python=3.12
  - pip
  - pip:
      # Document generation runtime (the generators/ pipeline).
      - pillow
      - numpy
      - pyyaml
      - typer
      - rich
      # Synthetic content generation for reseeding (scripts/seed_*.py).
      # Pinned: faker's version determines generated content, so pinning keeps
      # reseeded ground truth reproducible across rebuilds.
      - faker==40.8.0

# NOTE: opencv (cv2) is intentionally omitted — it is used only by the
# standalone camera-scan scripts (degrade_camera_scan.py /
# rectify_camera_scan.py), not the core generators pipeline. Install
# opencv-python-headless separately where the camera-scan feature is needed.
